<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Ticket Transcript</title>
<style>
  html, body { margin: 0; height: 100%; background: #313338; color: #dbdee1;
    font: 15px/1.5 "gg sans", "Segoe UI", Roboto, Arial, sans-serif; }
  #durum { display: flex; align-items: center; justify-content: center; height: 100%;
    padding: 0 24px; box-sizing: border-box; text-align: center; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div id="durum">Transcript yükleniyor…</div>
<script>
/* Transcript'ler bu repoda şifreli durur (t/<kimlik>.bin, AES-256-GCM, gzip).
   Anahtar linkin # sonrasındadır; tarayıcı bunu hiçbir sunucuya göndermez.
   Çözme işlemi tamamen bu sayfada, okuyanın tarayıcısında yapılır. */
(async () => {
  const durum = document.getElementById('durum');
  const yaz = m => { durum.textContent = m; };
  const parca = location.hash.slice(1).split('.');
  if (parca.length !== 2 || !/^[\w-]{8,64}$/.test(parca[0]) || !/^[\w-]{40,50}$/.test(parca[1])) {
    return yaz('Geçersiz transcript linki.');
  }
  const [kimlik, anahtarMetni] = parca;
  const b64url = s => Uint8Array.from(
    atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), c => c.charCodeAt(0));

  // Yeni yüklenen transcript GitHub Pages'te ~1 dakika içinde yayınlanır: o arada tekrar dene
  let yanit;
  for (let deneme = 1; deneme <= 25; deneme++) {
    yanit = await fetch(`t/${kimlik}.bin`, { cache: 'no-store' });
    if (yanit.ok || yanit.status !== 404) break;
    yaz(`Transcript yayınlanıyor, birkaç saniye içinde açılacak… (${deneme})`);
    await new Promise(r => setTimeout(r, 6000));
  }
  if (!yanit.ok) {
    return yaz(yanit.status === 404 ? 'Transcript bulunamadı. Link yanlış ya da silinmiş olabilir.'
                                     : `Transcript alınamadı (${yanit.status}).`);
  }
  try {
    const veri = new Uint8Array(await yanit.arrayBuffer());
    const anahtar = await crypto.subtle.importKey('raw', b64url(anahtarMetni), 'AES-GCM', false, ['decrypt']);
    const acik = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: veri.slice(0, 12) }, anahtar, veri.slice(12));
    const html = await new Response(new Blob([acik]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.title = new DOMParser().parseFromString(html, 'text/html').title || 'Ticket Transcript';
    const cerceve = document.createElement('iframe');
    cerceve.sandbox = 'allow-popups allow-popups-to-escape-sandbox';   // transcript içinde kod çalışamaz
    cerceve.referrerPolicy = 'no-referrer';
    cerceve.srcdoc = html;
    durum.replaceWith(cerceve);
  } catch (e) {
    yaz('Transcript açılamadı: link eksik kopyalanmış ya da bozuk.');
  }
})();
</script>
</body>
</html>
